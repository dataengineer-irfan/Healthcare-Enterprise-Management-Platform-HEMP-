server:
  port: 8080

spring:
  application:
    name: hemp-demo-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hemp_db}
    username: ${SPRING_DATASOURCE_USERNAME:hemp_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:hemp_secure_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration,filesystem:../database/migrations

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

hemp:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
